<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>한끼살핌 | 알레르기 정보</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #242424;
        background: #fffdf5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2rem 1rem;
      }

      main {
        width: min(100%, 52rem);
        margin: 0 auto;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0.25rem;
      }

      .subtitle,
      .profile-label,
      .help-text {
        color: #555;
      }

      .card {
        margin-top: 1.5rem;
        padding: 1.5rem;
        border: 1px solid #ded8c4;
        border-radius: 0.75rem;
        background: #fff;
      }

      fieldset {
        min-width: 0;
        margin: 1.25rem 0;
        padding: 1rem;
        border: 1px solid #ded8c4;
        border-radius: 0.5rem;
      }

      legend {
        padding: 0 0.4rem;
        font-weight: 700;
      }

      .allergy-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.25rem 1rem;
      }

      .allergy-option {
        display: flex;
        min-height: 2.75rem;
        align-items: center;
        gap: 0.65rem;
        padding: 0.35rem;
        border-radius: 0.35rem;
      }

      input[type="checkbox"] {
        width: 1.1rem;
        height: 1.1rem;
        accent-color: #675321;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      button {
        min-height: 2.75rem;
        padding: 0.55rem 1rem;
        border: 1px solid #675321;
        border-radius: 0.4rem;
        background: #675321;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #fff;
        color: #4a3b17;
      }

      button:disabled {
        border-color: #aaa;
        background: #ddd;
        color: #555;
        cursor: not-allowed;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #175c9e;
        outline-offset: 2px;
      }

      #selection-summary {
        margin: 1rem 0 0;
        font-weight: 600;
      }

      #save-status {
        min-height: 1.5rem;
        margin: 0.5rem 0 0;
      }

      .notice {
        margin-top: 1.25rem;
        padding: 1rem;
        border-left: 4px solid #8a6c1d;
        background: #f7f1df;
      }

      @media (max-width: 36rem) {
        body {
          padding: 1rem 0.75rem;
        }

        .card {
          padding: 1rem;
        }

        .allergy-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>한끼살핌</h1>
        <p class="subtitle">알레르기 정보를 등록하고 저장된 내용을 확인합니다.</p>
      </header>

      <section class="card" aria-labelledby="profile-heading">
        <h2 id="profile-heading">알레르기 정보 등록</h2>
        <p class="profile-label">데모 프로필: <strong>테스트 자녀</strong></p>
        <p class="help-text">해당하는 항목을 선택한 뒤 저장하세요. 선택 항목은 언제든지 수정할 수 있습니다.</p>

        <form id="profile-form">
          <fieldset id="allergy-fieldset" disabled>
            <legend>알레르기 항목</legend>
            <div id="allergy-options" class="allergy-grid"></div>
          </fieldset>
          <div class="actions">
            <button id="save-button" type="submit" disabled>저장</button>
            <button id="retry-button" class="secondary" type="button" hidden>다시 불러오기</button>
          </div>
          <p id="selection-summary">알레르기 항목을 불러오는 중입니다.</p>
          <p id="save-status" role="status" aria-live="polite">저장된 정보를 확인하고 있습니다.</p>
        </form>
      </section>

      <aside class="notice">
        <strong>확인 안내</strong>
        <p>이 서비스는 입력된 정보를 정리해 보여줄 뿐, 음식의 안전성을 판정하거나 보장하지 않습니다. 실제 원재료와 조리 과정은 교육기관 담당자에게 확인해 주세요.</p>
      </aside>
    </main>

    <script>
      const API_BASE_URL = "http://127.0.0.1:8000";
      const form = document.querySelector("#profile-form");
      const fieldset = document.querySelector("#allergy-fieldset");
      const optionsContainer = document.querySelector("#allergy-options");
      const saveButton = document.querySelector("#save-button");
      const retryButton = document.querySelector("#retry-button");
      const selectionSummary = document.querySelector("#selection-summary");
      const saveStatus = document.querySelector("#save-status");

      let allergyOptions = [];
      let savedAllergies = [];
      let isLoaded = false;
      let isSaving = false;

      function getSelectedAllergies() {
        return Array.from(
          optionsContainer.querySelectorAll('input[type="checkbox"]:checked'),
          (input) => input.value,
        );
      }

      function renderOptions(options, selectedAllergies) {
        const selected = new Set(selectedAllergies);
        optionsContainer.replaceChildren();

        for (const allergy of options) {
          const label = document.createElement("label");
          label.className = "allergy-option";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = "allergies";
          checkbox.value = allergy;
          checkbox.checked = selected.has(allergy);
          checkbox.addEventListener("change", () => updateFormState());

          const text = document.createElement("span");
          text.textContent = allergy === "난류(가금류)"
            ? "난류(달걀 등 가금류 알)"
            : allergy;

          label.append(checkbox, text);
          optionsContainer.append(label);
        }
      }

      function updateFormState(statusMessage) {
        const current = getSelectedAllergies();
        const hasUnsavedChanges =
          current.length !== savedAllergies.length ||
          current.some((allergy, index) => allergy !== savedAllergies[index]);

        selectionSummary.textContent = current.length
          ? `선택한 항목: ${current.join(", ")}`
          : "선택한 알레르기 항목이 없습니다.";

        if (statusMessage) {
          saveStatus.textContent = statusMessage;
        } else if (!isSaving) {
          saveStatus.textContent = hasUnsavedChanges
            ? "저장되지 않은 변경 사항이 있습니다."
            : current.length
              ? "저장된 상태입니다."
              : "저장된 알레르기 항목이 없습니다.";
        }

        saveButton.disabled = !isLoaded || isSaving || !hasUnsavedChanges;
      }

      async function requestJson(path, options) {
        const response = await fetch(`${API_BASE_URL}${path}`, options);
        let payload;

        try {
          payload = await response.json();
        } catch (error) {
          if (error instanceof SyntaxError) {
            throw new Error("서버 응답 형식이 올바르지 않습니다.");
          }
          throw error;
        }

        if (
          payload === null ||
          typeof payload !== "object" ||
          Array.isArray(payload)
        ) {
          throw new Error("서버 응답 형식이 올바르지 않습니다.");
        }

        if (!response.ok) {
          const detail = typeof payload.detail === "string"
            ? payload.detail
            : "요청한 정보를 처리하지 못했습니다.";
          throw new Error(`${detail} (HTTP ${response.status})`);
        }

        return payload;
      }

      function showLoadError(error) {
        const message = error instanceof TypeError
          ? "API 서버에 연결할 수 없습니다. README의 실행 안내를 확인해 주세요."
          : `정보를 불러오지 못했습니다. ${error.message}`;
        saveStatus.textContent = message;
        retryButton.hidden = false;
      }

      async function loadProfile() {
        isLoaded = false;
        fieldset.disabled = true;
        saveButton.disabled = true;
        retryButton.hidden = true;
        saveStatus.textContent = "저장된 정보를 불러오는 중입니다.";

        try {
          const [allergens, profile] = await Promise.all([
            requestJson("/api/allergens"),
            requestJson("/api/profile"),
          ]);

          if (
            !Array.isArray(allergens.items) ||
            allergens.items.some((item) => typeof item !== "string") ||
            profile.id !== "demo-child" ||
            !Array.isArray(profile.allergies) ||
            profile.allergies.some((item) => typeof item !== "string") ||
            profile.allergies.some((item) => !allergens.items.includes(item))
          ) {
            throw new Error("알레르기 정보 응답을 확인할 수 없습니다.");
          }

          allergyOptions = allergens.items;
          renderOptions(allergyOptions, profile.allergies);
          savedAllergies = getSelectedAllergies();
          fieldset.disabled = false;
          isLoaded = true;
          updateFormState();
        } catch (error) {
          showLoadError(error);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!isLoaded || isSaving) {
          return;
        }

        const allergies = getSelectedAllergies();
        isSaving = true;
        fieldset.disabled = true;
        saveButton.disabled = true;
        saveStatus.textContent = "알레르기 정보를 저장하고 있습니다.";
        let resultMessage;

        try {
          const profile = await requestJson("/api/profile", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ allergies }),
          });

          if (
            profile.id !== "demo-child" ||
            !Array.isArray(profile.allergies) ||
            profile.allergies.some((item, index) => item !== allergies[index]) ||
            profile.allergies.length !== allergies.length
          ) {
            throw new Error("저장 결과를 확인할 수 없습니다.");
          }

          savedAllergies = allergies;
          resultMessage = "저장했습니다. 새로고침 후에도 선택 내용이 유지됩니다.";
        } catch (error) {
          resultMessage = error instanceof TypeError
            ? "API 서버에 연결할 수 없어 저장하지 못했습니다."
            : `저장하지 못했습니다. ${error.message}`;
        } finally {
          isSaving = false;
          fieldset.disabled = !isLoaded;
          updateFormState(resultMessage);
        }
      });

      retryButton.addEventListener("click", loadProfile);
      loadProfile();
    </script>
  </body>
</html>
